project: pearls_lahore_aqi
provider: local
registry:
  registry_type: sql
  path: ${FEAST_POSTGRES_URL}
  cache_ttl_seconds: 60
offline_store:
  type: postgres
  host: ${FEAST_POSTGRES_HOST}
  port: ${FEAST_POSTGRES_PORT}
  database: ${FEAST_POSTGRES_DATABASE}
  db_schema: ${FEAST_POSTGRES_SCHEMA}
  user: ${FEAST_POSTGRES_USER}
  password: ${FEAST_POSTGRES_PASSWORD}
  sslmode: require
online_store:
  type: postgres
  host: ${FEAST_POSTGRES_HOST}
  port: ${FEAST_POSTGRES_PORT}
  database: ${FEAST_POSTGRES_DATABASE}
  db_schema: ${FEAST_POSTGRES_SCHEMA}
  user: ${FEAST_POSTGRES_USER}
  password: ${FEAST_POSTGRES_PASSWORD}
  sslmode: require
