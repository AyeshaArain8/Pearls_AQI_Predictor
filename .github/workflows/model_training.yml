name: AQI Model Training

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  train_model:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate Feast Secrets
        env:
          FEAST_POSTGRES_URL: ${{ secrets.FEAST_POSTGRES_URL }}
          FEAST_POSTGRES_HOST: ${{ secrets.FEAST_POSTGRES_HOST }}
          FEAST_POSTGRES_PORT: ${{ secrets.FEAST_POSTGRES_PORT }}
          FEAST_POSTGRES_DATABASE: ${{ secrets.FEAST_POSTGRES_DATABASE }}
          FEAST_POSTGRES_SCHEMA: ${{ secrets.FEAST_POSTGRES_SCHEMA }}
          FEAST_POSTGRES_USER: ${{ secrets.FEAST_POSTGRES_USER }}
          FEAST_POSTGRES_PASSWORD: ${{ secrets.FEAST_POSTGRES_PASSWORD }}
        run: |
          python -c "import os; required=['FEAST_POSTGRES_URL','FEAST_POSTGRES_HOST','FEAST_POSTGRES_PORT','FEAST_POSTGRES_DATABASE','FEAST_POSTGRES_SCHEMA','FEAST_POSTGRES_USER','FEAST_POSTGRES_PASSWORD']; missing=[x for x in required if not os.getenv(x)]; assert not missing, f'Missing Feast secrets: {missing}'"

      - name: Train Forecast Model
        env:
          PYTHONUNBUFFERED: "1"
          FEAST_POSTGRES_URL: ${{ secrets.FEAST_POSTGRES_URL }}
          FEAST_POSTGRES_HOST: ${{ secrets.FEAST_POSTGRES_HOST }}
          FEAST_POSTGRES_PORT: ${{ secrets.FEAST_POSTGRES_PORT }}
          FEAST_POSTGRES_DATABASE: ${{ secrets.FEAST_POSTGRES_DATABASE }}
          FEAST_POSTGRES_SCHEMA: ${{ secrets.FEAST_POSTGRES_SCHEMA }}
          FEAST_POSTGRES_USER: ${{ secrets.FEAST_POSTGRES_USER }}
          FEAST_POSTGRES_PASSWORD: ${{ secrets.FEAST_POSTGRES_PASSWORD }}
        run: |
          python -m src.train_forecast

      - name: Upload Trained Models
        uses: actions/upload-artifact@v4
        with:
          name: trained-models
          path: models/registry/
          if-no-files-found: error

      - name: Upload SHAP Report
        uses: actions/upload-artifact@v4
        with:
          name: shap-report
          path: reports/shap_*.csv
          if-no-files-found: error

      - name: Persist approved Model Registry
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add models/registry/
          git diff --cached --quiet || git commit -m "model: register forecast model"
          git push