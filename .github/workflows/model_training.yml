name: AQI Model Training

on:
  schedule:
    - cron: "0 0 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  train_model:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Train Forecast Model
        run: |
          python src/train_forecast.py

      - name: Upload Trained Models
        uses: actions/upload-artifact@v4
        with:
          name: trained-models
          path: models/registry/

      - name: Persist approved Model Registry
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add models/registry/
          git diff --cached --quiet || git commit -m "model: register Lahore forecast version"
          git push
