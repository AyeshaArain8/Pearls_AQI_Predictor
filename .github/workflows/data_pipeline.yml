name: AQI Data Pipeline

on:
  schedule:
    # Runs every hour
    - cron: "0 * * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  data_pipeline:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create .env
        run: |
          test -n "${{ secrets.OPENWEATHER_API_KEY }}" || { echo "OPENWEATHER_API_KEY secret is required"; exit 1; }
          echo "OPENWEATHER_API_KEY=${{ secrets.OPENWEATHER_API_KEY }}" > .env

      - name: Fetch Live AQI Data
        run: |
          python src/feature_pipeline.py

      - name: Upload Processed Data
        uses: actions/upload-artifact@v4
        with:
          name: processed-data
          path: data/feature_store/

      - name: Persist Lahore Feature Store
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/feature_store/
          git diff --cached --quiet || git commit -m "data: update Lahore feature store"
          git push
